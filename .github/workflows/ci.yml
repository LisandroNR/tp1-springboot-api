name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Permiso de ejecución al wrapper
        run: chmod +x mvnw

      - name: Compilar y correr tests (unitarios + integración)
        run: ./mvnw verify