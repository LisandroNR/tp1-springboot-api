spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# 1. Datos de conexión a tu PostgreSQL (los mismos que pusiste en el Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/web2_tp2
spring.datasource.username=root
spring.datasource.password=root

# 2. Configuración de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false