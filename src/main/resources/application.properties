# Nombre de la aplicación
spring.application.name=demo

# Puerto (Render inyecta PORT; en local usa 8080)
server.port=${PORT:8080}

# Conexión a Base de Datos con Variables de Entorno (valores por defecto para local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tu_base_de_datos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate / JPA (el esquema lo manejan las migraciones de Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Secreto para firmar el JWT (mínimo 256 bits / 32 caracteres)
jwt.secret=${JWT_SECRET:este-es-un-secreto-local-muy-largo-solo-para-desarrollo-123456}

# Cliente de DummyJSON (el que faltaba y rompía los tests)
app.dummyjson.base-url=${DUMMYJSON_BASE_URL:https://dummyjson.com}